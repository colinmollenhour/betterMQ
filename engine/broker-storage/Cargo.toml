[package]
name = "broker-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WAL, segments, and RocksDB indexes"

[features]
default = []
s3 = ["dep:object_store", "dep:bytes", "dep:futures"]
slate = ["s3", "dep:slatedb"]

[dependencies]
broker-proto = { workspace = true }
bincode-next = { workspace = true }
rocksdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = { version = "1", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = { version = "0.3", optional = true }
slatedb = { version = "0.13", optional = true }
object_store = { version = "0.12", optional = true, features = ["aws"] }
fs2 = "0.4"
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
crc32c = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
criterion = "0.5"
fjall = "2.11.2"

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "state_index"
harness = false

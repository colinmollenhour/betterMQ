[package]
name = "broker-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BetterMQ broker binary"

[[bin]]
name = "bettermq"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true

[dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
rust-embed = "8"
mime_guess = "2"
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

broker-api = { workspace = true }
broker-cli = { workspace = true }
broker-partition = { workspace = true, features = ["slate"] }
broker-storage = { workspace = true, features = ["slate"] }
broker-dispatch = { workspace = true }
broker-schedule = { workspace = true }
broker-raft-meta = { workspace = true }
broker-replication = { workspace = true }
broker-local-auth = { workspace = true }
broker-config = { workspace = true }
broker-proto = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
wiremock = "0.6"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
broker-dispatch = { workspace = true }
serde_json = { workspace = true }

# Self-host: single node, local WAL + RocksDB.
#
# Prefers the published image (no Rust toolchain needed):
#   cd selfhost && docker compose up -d
#
# Build from source instead:
#   docker compose up -d --build
#
#   open http://localhost:8080/panel/
#
# The container listens on 0.0.0.0:8080; the host publishes it on 127.0.0.1
# only. First-boot setup asks for the setup code printed by
# `docker compose logs bettermq`. For remote access use an SSH tunnel or a TLS
# reverse proxy (or change the binding to "8080:8080" deliberately).
#
# Configure storage and cluster from Panel → Infrastructure (no config file mount).

services:
  bettermq:
    image: ${BETTERMQ_IMAGE:-ghcr.io/colinmollenhour/bettermq}:${BETTERMQ_VERSION:?pin BETTERMQ_VERSION to a release tag}
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bettermq-data:/data
    command: ["serve", "--data-dir", "/data"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: ${BETTERMQ_STOP_GRACE_PERIOD:-120s}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  bettermq-data:

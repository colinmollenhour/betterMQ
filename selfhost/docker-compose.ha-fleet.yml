# HA + fleet: 3 brokers (shared meta) + N fleet workers.
#
#   export BETTERMQ_CLUSTER_SECRET=$(openssl rand -hex 32)
#   export BETTERMQ_METRICS_TOKEN=$(openssl rand -hex 32)
#   cd selfhost && docker compose -f docker-compose.ha-fleet.yml up -d --build
#   docker compose -f docker-compose.ha-fleet.yml up -d --scale fleet=3
#
# Brokers: http://localhost:8081–8083 (API + panel)
# Fleet: no public ports; claims via BETTERMQ_BROKER_URLS

x-broker: &broker
  image: ${BETTERMQ_IMAGE:-ghcr.io/colinmollenhour/bettermq}:${BETTERMQ_VERSION:?pin BETTERMQ_VERSION to a release tag}
  build:
    context: ..
    dockerfile: selfhost/Dockerfile
  environment: &broker-env
    BETTERMQ_INTERNAL_LISTEN: 0.0.0.0:9080
    BETTERMQ_CLUSTER_SECRET: ${BETTERMQ_CLUSTER_SECRET:?set BETTERMQ_CLUSTER_SECRET}
    # Leases, cursors, catalogs and host breaker only. Delayed-job and cron
    # journals stay in each broker's own data dir; delayed delivery and cron
    # create/update return 501 in a cell (see README "Scheduling in a cell").
    BETTERMQ_SHARED_META_DIR: /cluster-shared/meta
    BETTERMQ_METRICS_TOKEN: ${BETTERMQ_METRICS_TOKEN:?set BETTERMQ_METRICS_TOKEN}
  volumes:
    - cluster-meta:/cluster-shared/meta
  restart: unless-stopped
  stop_grace_period: ${BETTERMQ_STOP_GRACE_PERIOD:-120s}
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s

services:
  broker1:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker1:9080
    ports:
      - "8081:8080"
    volumes:
      - cluster-meta:/cluster-shared/meta
      - broker1-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
        "--broker-only",
      ]

  broker2:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker2:9080
    ports:
      - "8082:8080"
    volumes:
      - cluster-meta:/cluster-shared/meta
      - broker2-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
        "--broker-only",
      ]

  broker3:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker3:9080
    ports:
      - "8083:8080"
    volumes:
      - cluster-meta:/cluster-shared/meta
      - broker3-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
        "--broker-only",
      ]

  fleet:
    image: ${BETTERMQ_IMAGE:-ghcr.io/colinmollenhour/bettermq}:${BETTERMQ_VERSION:?pin BETTERMQ_VERSION to a release tag}
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    environment:
      BETTERMQ_CLUSTER_SECRET: ${BETTERMQ_CLUSTER_SECRET:?set BETTERMQ_CLUSTER_SECRET}
      BETTERMQ_BROKER_URLS: http://broker1:9080,http://broker2:9080,http://broker3:9080
      BETTERMQ_FLEET_CONCURRENCY: "1"
      # Optional long-wait tier (fleet only): 15m | 1h | 6h | 12h
      # BETTERMQ_LONG_WAIT_TIER: 1h
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: ${BETTERMQ_STOP_GRACE_PERIOD:-120s}
    command:
      [
        "serve",
        "--data-dir",
        "/tmp/fleet-data",
        "--listen",
        "127.0.0.1:8080",
        "--dispatch-fleet",
      ]

volumes:
  cluster-meta:
  broker1-data:
  broker2-data:
  broker3-data:

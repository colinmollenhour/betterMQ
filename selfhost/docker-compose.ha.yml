# Self-host HA: 3 brokers with fixed RF=3 (each shard has 3 replicas).
# Extra brokers in larger cells host other shard leaders, not extra copies
# of every message.
#
#   cd selfhost && docker compose -f docker-compose.ha.yml up -d --build
#
# Panel: http://localhost:8081/panel/  (broker1)
# Standalone panel: docker compose -f docker-compose.panel.yml up -d
# Requires BETTERMQ_CLUSTER_SECRET and BETTERMQ_METRICS_TOKEN (set in .env).
#
# After first boot: configure cluster from Panel → Infrastructure on broker1,
# then join broker2/broker3 (or pre-seed bettermq.json). Shared meta is at
# /cluster-shared/meta on every node.

x-broker: &broker
  image: ${BETTERMQ_IMAGE:-ghcr.io/colinmollenhour/bettermq}:${BETTERMQ_VERSION:?pin BETTERMQ_VERSION to a release tag}
  build:
    context: ..
    dockerfile: selfhost/Dockerfile
  environment: &broker-env
    BETTERMQ_INTERNAL_LISTEN: 0.0.0.0:9080
    BETTERMQ_CLUSTER_SECRET: ${BETTERMQ_CLUSTER_SECRET:?set BETTERMQ_CLUSTER_SECRET}
    # Leases, cursors, catalogs and host breaker only. Delayed-job and cron
    # journals stay in each broker's own data dir; delayed delivery and cron
    # create/update return 501 in a cell (see README "Scheduling in a cell").
    BETTERMQ_SHARED_META_DIR: /cluster-shared/meta
    BETTERMQ_METRICS_TOKEN: ${BETTERMQ_METRICS_TOKEN:?set BETTERMQ_METRICS_TOKEN}
  volumes:
    - cluster-meta:/cluster-shared/meta
  restart: unless-stopped
  stop_grace_period: ${BETTERMQ_STOP_GRACE_PERIOD:-120s}
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s

services:
  broker1:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker1:9080
    ports:
      - "8081:8080"
    volumes:
      - cluster-meta:/cluster-shared/meta
      - broker1-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
      ]

  broker2:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker2:9080
    ports:
      - "8082:8080"
    volumes:
      - cluster-meta:/cluster-shared/meta
      - broker2-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
      ]

  broker3:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker3:9080
    ports:
      - "8083:8080"
    volumes:
      - cluster-meta:/cluster-shared/meta
      - broker3-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
      ]

volumes:
  cluster-meta:
  broker1-data:
  broker2-data:
  broker3-data:

# HA Slate + fleet: 3 brokers (S3/MinIO) + N fleet workers.
#
#   export BETTERMQ_CLUSTER_SECRET=$(openssl rand -hex 32)
#   export BETTERMQ_METRICS_TOKEN=$(openssl rand -hex 32)
#   export MINIO_ROOT_USER=bettermq MINIO_ROOT_PASSWORD=$(openssl rand -hex 32)
#   cd selfhost && docker compose -f docker-compose.ha-slate-fleet.yml up -d --build
#   docker compose -f docker-compose.ha-slate-fleet.yml up -d --scale fleet=3
#
# MinIO here is single-node (dev only — not object-store HA).

x-broker: &broker
  image: ${BETTERMQ_IMAGE:-ghcr.io/colinmollenhour/bettermq}:${BETTERMQ_TAG:-latest}
  build:
    context: ..
    dockerfile: selfhost/Dockerfile
  environment: &broker-env
    BETTERMQ_INTERNAL_LISTEN: 0.0.0.0:9080
    BETTERMQ_CLUSTER_SECRET: ${BETTERMQ_CLUSTER_SECRET:?set BETTERMQ_CLUSTER_SECRET}
    BETTERMQ_STORAGE: slate
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: bettermq
    S3_PAYLOAD_BUCKET: bettermq-payloads
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    S3_REGION: us-east-1
    BETTERMQ_METRICS_TOKEN: ${BETTERMQ_METRICS_TOKEN:?set BETTERMQ_METRICS_TOKEN}
  depends_on:
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: ${BETTERMQ_STOP_GRACE_PERIOD:-120s}
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 45s

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc ready local; do
          attempts=$$((attempts + 1))
          [ "$$attempts" -lt 60 ] || { echo 'MinIO initialization timed out' >&2; exit 1; }
          sleep 1
        done
        mc mb --ignore-existing local/bettermq
        mc mb --ignore-existing local/bettermq-payloads

  broker1:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker1:9080
    ports:
      - "8081:8080"
    volumes:
      - broker1-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
        "--broker-only",
      ]

  broker2:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker2:9080
    ports:
      - "8082:8080"
    volumes:
      - broker2-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
        "--broker-only",
      ]

  broker3:
    <<: *broker
    environment:
      <<: *broker-env
      BETTERMQ_INTERNAL_URL: http://broker3:9080
    ports:
      - "8083:8080"
    volumes:
      - broker3-data:/data
    command:
      [
        "serve",
        "--data-dir",
        "/data",
        "--listen",
        "0.0.0.0:8080",
        "--broker-only",
      ]

  fleet:
    image: ${BETTERMQ_IMAGE:-ghcr.io/colinmollenhour/bettermq}:${BETTERMQ_TAG:-latest}
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    environment:
      BETTERMQ_CLUSTER_SECRET: ${BETTERMQ_CLUSTER_SECRET:?set BETTERMQ_CLUSTER_SECRET}
      BETTERMQ_BROKER_URLS: http://broker1:9080,http://broker2:9080,http://broker3:9080
      BETTERMQ_FLEET_CONCURRENCY: "1"
    depends_on:
      broker1:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: ${BETTERMQ_STOP_GRACE_PERIOD:-120s}
    command:
      [
        "serve",
        "--data-dir",
        "/tmp/fleet-data",
        "--listen",
        "127.0.0.1:8080",
        "--dispatch-fleet",
      ]

volumes:
  minio-data:
  broker1-data:
  broker2-data:
  broker3-data:

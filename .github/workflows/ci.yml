name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to validate
        type: string
        required: true
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Offline PowerShell checksum failure tests
        shell: pwsh
        run: ./selfhost/tests/test_installers.ps1

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: engine/panel/package-lock.json
      - name: Build, typecheck and audit panel
        working-directory: engine/panel
        run: |
          npm ci
          npm run build
          npm audit --omit=dev
      - name: Reject stale or untracked panel assets
        run: |
          git diff --exit-code -- engine/panel/dist
          test -z "$(git status --porcelain -- engine/panel/dist)"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install libclang (bindgen for librocksdb-sys)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: build broker-server
        run: cargo build -p broker-server --release

  selfhost-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/Dockerfile
          load: true
          tags: bettermq-ci:smoke
          cache-from: type=gha,scope=bettermq-ci
          cache-to: type=gha,mode=max,scope=bettermq-ci
      - name: Fresh HA volumes and private-listener smoke
        run: bash selfhost/tests/smoke_image.sh bettermq-ci smoke

  selfhost-compose-validate:
    runs-on: ubuntu-latest
    env:
      BETTERMQ_VERSION: ci
      MINIO_IMAGE: minio/minio:config-validation-only
      MINIO_MC_IMAGE: minio/mc:config-validation-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: validate compose files
        working-directory: selfhost
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          MINIO_IMAGE=local/minio:ci MINIO_MC_IMAGE=local/minio-mc:ci MINIO_ROOT_USER=ci MINIO_ROOT_PASSWORD=ci-secret-not-default docker compose -f docker-compose.slate.yml config >/dev/null
          BETTERMQ_CLUSTER_SECRET=ci-secret BETTERMQ_METRICS_TOKEN=ci-metrics docker compose -f docker-compose.ha.yml config >/dev/null
          BETTERMQ_CLUSTER_SECRET=ci-secret BETTERMQ_METRICS_TOKEN=ci-metrics docker compose -f docker-compose.ha-fleet.yml config >/dev/null
          python3 tests/test_compose.py
          python3 tests/test_internal_compose.py
          python3 tests/test_installers.py
          python3 ../scripts/test_load_test.py
          bash tests/test_backup_restore.sh

  slate-minio:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: bettermq-ci
      S3_PAYLOAD_BUCKET: bettermq-ci-payloads
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-not-default
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      - name: Build pinned MinIO (upstream container images were removed)
        run: go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
      - name: Start isolated MinIO
        run: |
          MINIO_ROOT_USER="$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" "$(go env GOPATH)/bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS "$S3_ENDPOINT/minio/health/live" && break; sleep 1; done
          curl -fsS "$S3_ENDPOINT/minio/health/live"
          curl -fsS --aws-sigv4 'aws:amz:us-east-1:s3' --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" -X PUT "$S3_ENDPOINT/bettermq-ci"
          curl -fsS --aws-sigv4 'aws:amz:us-east-1:s3' --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" -X PUT "$S3_ENDPOINT/bettermq-ci-payloads"
      - name: Slate admission, dispatch and restart durability
        run: cargo test -p broker-server --test slate_minio -- --ignored --nocapture

  release-gates:
    runs-on: ubuntu-latest
    needs: [rust, panel, selfhost-compose-validate, selfhost-image]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install libclang (bindgen for librocksdb-sys)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: SSRF + lease unit gates
        run: |
          cargo test -p broker-dispatch egress -- --nocapture
          cargo test -p broker-dispatch lease -- --nocapture
          cargo test -p broker-dispatch host_blocker -- --nocapture
          cargo test -p broker-dispatch completion_race -- --nocapture
          cargo test -p broker-storage group_commit -- --nocapture
          cargo test -p broker-raft-meta epoch -- --nocapture

      - name: durable WAL fsync truth gate
        run: cargo test -p broker-storage --test durable_wal_truth_gate -- --nocapture

      - name: replicated HTTP ingest and SIGKILL failover gate
        timeout-minutes: 10
        run: cargo test -p broker-server --test replicated_http -- --ignored --nocapture

      - name: ingest microbenches (smoke)
        run: cargo bench -p broker-proto --bench encode -- --sample-size 10

  perf-gate:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install libclang (bindgen for librocksdb-sys)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: document launch gate
        run: |
          echo "Launch gate (dedicated 3-broker NVMe cell): >=100k durable msg/s, p50<=5ms p99<=20ms."
          echo "CI records a correctness+compile gate; do not market Kafka-like numbers from this job."
          cargo test -p broker-partition independent_shards -- --nocapture
